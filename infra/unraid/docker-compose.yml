# Way — Unraid stack (Docker Compose Manager plugin).
# Prebuilt images from ghcr.io; data under APPDATA (default /mnt/user/appdata/way).
# Set the variables in the stack's ENV file (see .env.example next to this file).

x-node-env: &node-env
  DATABASE_URL: postgres://way:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/way
  REDIS_URL: redis://redis:6379
  WAY_CONTACT: ${WAY_CONTACT:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  GLOBAL_MIN_SITELINKS: ${GLOBAL_MIN_SITELINKS:-5}
  GLOBAL_LIMIT: ${GLOBAL_LIMIT:-1200}
  TZ: ${TZ:-Europe/Paris}

services:
  front:
    image: ghcr.io/bordecielnas-alt/way-front:${WAY_TAG:-latest}
    container_name: way-front
    restart: unless-stopped
    ports:
      - "${WAY_PORT:-8088}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
    mem_limit: 64m
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:80]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/bordecielnas-alt/Way/main/infra/unraid/icon.svg"

  api:
    image: ghcr.io/bordecielnas-alt/way-api:${WAY_TAG:-latest}
    container_name: way-api
    restart: unless-stopped
    environment:
      <<: *node-env
      BORDERS_DIR: /data/borders
    volumes:
      - ${APPDATA:-/mnt/user/appdata/way}/borders:/data/borders:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      borders: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    mem_limit: 512m

  worker:
    image: ghcr.io/bordecielnas-alt/way-worker:${WAY_TAG:-latest}
    container_name: way-worker
    restart: unless-stopped
    environment: *node-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
    mem_limit: 768m

  # One-shot: downloads the historical border snapshots (GPL-3.0, ~66 MB) once.
  borders:
    image: ghcr.io/bordecielnas-alt/way-api:${WAY_TAG:-latest}
    container_name: way-borders
    user: "0"
    command: ["node", "scripts/fetch-borders.mjs"]
    volumes:
      - ${APPDATA:-/mnt/user/appdata/way}/borders:/app/data/borders
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: way-redis
    restart: unless-stopped
    # BullMQ needs noeviction: jobs must never be silently dropped.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${APPDATA:-/mnt/user/appdata/way}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    mem_limit: 256m

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: way-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: way
      POSTGRES_USER: way
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${APPDATA:-/mnt/user/appdata/way}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U way -d way"]
      interval: 10s
      timeout: 3s
    mem_limit: 2g
