# Way — one container. Usage: docker compose up -d, then open http://localhost:8080
services:
  way:
    image: ghcr.io/bordecielnas-alt/way:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WAY_CONTACT: ""   # your email or URL (Wikimedia asks API clients for a contact)
    volumes:
      - ./data-way:/data
