# Way — V0 stack. Usage: cp .env.example .env, then either
#   docker compose pull && docker compose up -d   (prebuilt images from ghcr.io)
#   docker compose up -d --build                    (build locally)
name: way

x-node: &node
  build:
    context: .
    dockerfile: infra/node.Dockerfile
  restart: unless-stopped
  environment: &node-env
    DATABASE_URL: postgres://way:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/way
    REDIS_URL: redis://redis:6379
    WAY_CONTACT: ${WAY_CONTACT:-}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    GLOBAL_MIN_SITELINKS: ${GLOBAL_MIN_SITELINKS:-5}
    GLOBAL_LIMIT: ${GLOBAL_LIMIT:-1200}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  front:
    image: ${WAY_IMAGE_PREFIX:-ghcr.io/bordecielnas-alt/way}-front:${WAY_TAG:-latest}
    build:
      context: .
      dockerfile: infra/front.Dockerfile
      args:
        VITE_SATELLITE_URL: ${VITE_SATELLITE_URL:-}
        VITE_SATELLITE_CREDIT: ${VITE_SATELLITE_CREDIT:-}
    restart: unless-stopped
    ports:
      - "${WAY_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
    mem_limit: 64m

  api:
    <<: *node
    image: ${WAY_IMAGE_PREFIX:-ghcr.io/bordecielnas-alt/way}-api:${WAY_TAG:-latest}
    build:
      context: .
      dockerfile: infra/node.Dockerfile
      args: { APP: api }
    environment:
      <<: *node-env
      BORDERS_DIR: /data/borders
    volumes:
      - borders:/data/borders:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      borders: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    mem_limit: 512m

  worker:
    <<: *node
    image: ${WAY_IMAGE_PREFIX:-ghcr.io/bordecielnas-alt/way}-worker:${WAY_TAG:-latest}
    build:
      context: .
      dockerfile: infra/node.Dockerfile
      args: { APP: worker }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
    mem_limit: 768m

  # One-shot: downloads historical border snapshots (GPL-3.0) into a volume.
  borders:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "scripts/fetch-borders.mjs"]
    volumes:
      - ./scripts/fetch-borders.mjs:/app/scripts/fetch-borders.mjs:ro
      - borders:/app/data/borders
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction: jobs must never be silently dropped.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    mem_limit: 256m

  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: way
      POSTGRES_USER: way
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U way -d way"]
      interval: 10s
      timeout: 3s
    mem_limit: 2g

volumes:
  postgres:
  redis:
  borders:
